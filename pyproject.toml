[project]
name = "site-auditor"
description = "Concurrent website crawler and link-health auditor"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "httpx>=0.27",
    "protego>=0.6.2",
    "url-normalize>=3.0.0",
]

[project.scripts]
siteaudit = "siteaudit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/siteaudit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/siteaudit"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
